; ESP32-Mosaic — sense engine firmware (PlatformIO)
;
; Configuration lives in include/config.h (gitignored).
;   cp include/config.example.h include/config.h   # then edit
;
; Build:  pio run
; Flash:  pio run -t upload

[env:esp32]
platform = espressif32
board = m5stack-grey
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; Passive BLE sense engine — NimBLE-Arduino (drop-in for BLEDevice/BLEScan)
; Controller-level duplicate filtering (DEVICE mode, cache 200) is configured
; in main.cpp setup(). Only passive scanning is used: no deauth/spam/replay/jam.
lib_deps =
    nimble-arduino@^2.5.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
