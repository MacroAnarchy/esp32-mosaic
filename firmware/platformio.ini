; ESP32-Mosaic — sense engine firmware (PlatformIO)
;
; NOTE: WiFi credentials are NOT hardcoded here.
; Copy this file to platformio.local.ini and fill in your own values:
;   cp platformio.ini platformio.local.ini
;   (edit platformio.local.ini, it's gitignored)
;
; Build:  pio run
; Flash:  pio run -t upload

[env:esp32]
platform = espressif32
board = m5stack-grey
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -D MOSAIC_WIFI_SSID="YOUR_WIFI_SSID"
    -D MOSAIC_WIFI_PASSWORD="YOUR_WIFI_PASSWORD"
    -D MOSAIC_GATEWAY_HOST="192.168.1.10"
    -D MOSAIC_GATEWAY_PORT=9000
