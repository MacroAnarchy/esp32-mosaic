; ESP32-Mosaic — sense engine firmware (PlatformIO)
;
; Configuration lives in include/config.h (gitignored).
;   cp include/config.example.h include/config.h   # then edit
;
; Build:  pio run
; Flash:  pio run -t upload

[env:esp32]
platform = espressif32
board = m5stack-grey
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; Passive BLE sense engine — NimBLE-Arduino (drop-in for BLEDevice/BLEScan)
; Controller-level duplicate filtering (DEVICE mode, cache 200) is configured
; in main.cpp setup(). Only passive scanning is used: no deauth/spam/replay/jam.
;
; Pre-build guard: refuse to compile/flash while include/config.h still has
; example placeholder values (a node flashed with "YOUR_WIFI_SSID" can never
; join WiFi — a dead node, silent pipeline. See scripts/check_config.py).
extra_scripts =
    pre:scripts/check_config.py

lib_deps =
    nimble-arduino@^2.5.1

build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; UI node env — the "face of the swarm". ESP-IDF framework; the display
; layer is M5GFX (LovyanGFX) on the CO5300 QSPI AMOLED with a PSRAM
; framebuffer. One unified firmware: BLE sense engine (components/sense)
; + WiFi reporting + the display face + OTA partition table. app_main
; lives in ui/main_ui.c; the sense engine runs in its own task.
;   pio run -e ui        # build
;   pio run -e ui -t upload --upload-port /dev/ttyACM0
; ---------------------------------------------------------------------------
[env:ui]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = ui/partitions.csv
src_dir = ui
; pre:espidf_env.py — PlatformIO 6.1.x ignores per-env src_dir for the
; ESP-IDF builder ($PROJECT_SRC_DIR comes from the [platformio] section
; only); this hook points the app component at ui/ for this env.
; pre:check_config.py — same placeholder-config guard as the Arduino env.
extra_scripts =
    pre:scripts/espidf_env.py
    pre:scripts/check_config.py
build_flags =
    -DMOSAIC_UI_ENABLE=1
