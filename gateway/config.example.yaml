# ESP32-Mosaic — gateway configuration
#
# Copy this file to config.yaml (same folder) and edit.
# config.yaml is gitignored.
#
#   cp config.example.yaml config.yaml

# --- Server ---
# Bind address (0.0.0.0 = all interfaces)
host: 0.0.0.0
port: 9000

# Where the gateway stores data
data_dir: ~/.orb

# Canonical JSONL log + SQLite query layer (relative to data_dir)
log_file: presence.jsonl
db_file: orb.db

# Optional: shared auth token for ingest. Leave empty for no auth.
# If set, nodes must send header "X-Mosaic-Token: <token>".
ingest_token: ""

# --- World model tuning (static for now — tuned the hard way) ---
#
# These are the analysis-layer thresholds. They stay STATIC in config
# until real data teaches us better values. No dynamic anything yet.
world_model:
  # RSSI floor: below this, a signal is treated as neighbor bleed / noise
  # and not counted for entity resolution. (e.g. -85 = through a wall)
  rssi_floor: -85

  # How long (seconds) a device must be seen consistently in one place
  # before AMBIGUOUS can resolve to PLACE (stationary entity).
  stationary_min_seconds: 604800   # 7 days, default

  # RSSI variance (dB) over the stationary window that still counts as
  # "not moving". Above this = movement evidence.
  stationary_max_rssi_variance: 8

  # Retroactive visit grouping: if a device is absent for less than this
  # gap (seconds), it's still the SAME visit (continuity of presence).
  # Gaps above this split visits. NOTE: retroactive by design — the
  # threshold is the ABSENCE that proves a break, not an arbitrary timer.
  visit_absence_gap_seconds: 300

  # Composite binding: minimum co-occurrence consistency (0.0-1.0) before
  # two leaf entities are treated as one composite (e.g. phone + watch = owner).
  composite_min_consistency: 0.8

  # Entity confidence: fraction of expected leaves seen in one window that
  # counts as "composite is present". 0.33 = any one of three devices implies
  # the person is here (branch implies trunk).
  composite_presence_threshold: 0.33

  # Reclassification: if a PLACE entity moves (appears in a different
  # location fingerprint), downgrade to AMBIGUOUS after this many
  # consecutive moving sightings.
  reclassify_after_moves: 3

  # Class coherence (BLE): the SAME device_class at the SAME RSSI level is
  # much stronger evidence of one rotating entity (FindMy/Meta accessories
  # keep their class across MAC rotation). DIFFERENT classes at one level are
  # different devices — a phone and an AirTag at -62 dB are NOT one entity.
  # Multipliers apply to the rotation-binding weight in mosaic_brain.py.
  # Recognized classes: findmy, meta, flipper ("unknown" carries no identity).
  class_match_multiplier: 1.5
  class_mismatch_penalty: 0.3

  # WiFi places registry (type:"wifi" beacon frames → BSSID table):
  # a BSSID becomes a PLACE entity when it has enough sightings, a stable
  # RSSI profile (it "never moves"), and a meaningful observation span.
  # Stability uses a RECENT-window robust p10-p90 spread from beacon_samples
  # (all-time min/max is outlier-poisoned — the home AP dips -31 once and
  # would read "8dB unstable" forever). 8dB admits the apartment's own
  # router (measured p10-p90 7dB) while still excluding noisy/moving BSSIDs.
  place_min_seen: 3
  place_max_rssi_variance: 8
  place_min_span_seconds: 86400   # 24h, default
  place_variance_window_seconds: 86400   # recent window for stability (24h)
  place_variance_min_samples: 5   # min samples in window before trusting it

  # Stream bind (entity chains): real BLE MAC rotation cadence (~14 min for a
  # phone's dual identities) is far beyond the tau=90s time-decay gate, so
  # chains fragment. The greedy temporal walk reconnects: an ENDED MAC A
  # followed by a new MAC B at the same RSSI level and (preferably) same
  # manufacturer company = one rotating identity. Observed handoff gaps in
  # live data: 20-23s; the rotation period is the ceiling for missed scans.
  stream_max_gap_seconds: 600   # max B.first - A.last for a stream edge
  stream_level_gate: 4          # dB: |avgA - avgB| for a stream edge

  # Lockstep (parallel identities): one physical object can advertise TWO
  # BLE identities (the desk phone rotates a company-76 and a company-301
  # MAC at the same level on independent ~14 min timers — the timers drift,
  # so rotation alignment beats and is NOT reliable evidence). The reliable
  # signature is SHARED ABSENCE: when the object leaves, ALL its identities
  # leave together (measured: both silent 05:01→06:36 to the minute).
  # Confirmed pairs = ONE object with two slots. Chains are never merged.
  lockstep_min_macs: 4              # min chain size to consider
  lockstep_level_gate: 4            # dB: |avgA - avgB|
  lockstep_cadence_tol: 1.5         # cadence ratio A/B within [1/tol, tol]
  lockstep_align_window_seconds: 180  # alignment window (informational only)
  lockstep_gap_min_minutes: 6       # silence this long = a real absence
  lockstep_gap_overlap_minutes: 3   # gaps overlap this much = shared
  lockstep_gap_shared_min: 0.5      # min shared fraction of the shorter list
